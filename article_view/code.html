<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ecodemia</title>
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="/assets/brand/favicon/favicon-32x32.png" sizes="32x32" type="image/png">
<link rel="icon" href="/assets/brand/favicon/favicon-16x16.png" sizes="16x16" type="image/png">
<link rel="apple-touch-icon" href="/assets/brand/favicon/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#0b3d2b">
<meta name="description" content="Independent, bilingual environmental reporting. Every article lists its sources.">
<link rel="preload" href="/assets/fonts/newsreader-normal-400-600-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/assets/fonts/schibsted-grotesk-normal-400-800-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/css/ecodemia.css">
</head>
<body data-page="article">
<div id="site-header"></div>

<main id="main">
  <div class="wrap">
    <p id="art-status" class="status">Loading article…</p>

    <article id="art" hidden>
      <header class="art-head">
        <span id="art-kicker" class="kicker"></span>
        <h1 id="art-title"></h1>
        <p id="art-stand" class="stand" hidden></p>
        <div id="art-meta" class="meta"></div>
        <div id="art-update" class="update-note" hidden></div>
      </header>

      <figure id="art-cover" class="art-cover" hidden>
        <img id="art-img" alt="">
        <figcaption id="art-credit"></figcaption>
      </figure>

      <div id="art-grid" class="art-grid">
        <nav id="art-toc" class="toc" aria-label="Contents" hidden></nav>
        <div>
          <aside id="art-facts" class="facts" hidden></aside>
          <div id="art-body" class="prose"></div>
          <section id="sources" class="sources" hidden></section>
        </div>
      </div>
    </article>
  </div>

  <section id="related" class="related wrap" hidden></section>
</main>

<div id="site-footer"></div>

<script src="/js/vendor/marked.min.js"></script>
<script src="/js/ecodemia.js"></script>
<script>
(function () {
  'use strict';
  var E = window.Eco, isDE = E.isDE, esc = E.esc;

  // Front matter parser: plain `key: value` and YAML block scalars (| or >)
  function parseFrontMatter(raw) {
    var m = raw.match(/^---\r?\n([\s\S]*?)\r?\n---\r?\n?([\s\S]*)$/);
    if (!m) return { data: {}, body: raw };
    var data = {}, lines = m[1].split(/\r?\n/), i = 0;
    while (i < lines.length) {
      var line = lines[i];
      if (/^\s/.test(line)) { i++; continue; }
      var c = line.indexOf(':');
      if (c === -1) { i++; continue; }
      var key = line.slice(0, c).trim(), rest = line.slice(c + 1).trim();
      if (/^[>|][+-]?$/.test(rest)) {
        var block = []; i++;
        while (i < lines.length && (lines[i] === '' || /^\s/.test(lines[i]))) {
          block.push(lines[i].replace(/^ {2}|^\t/, '')); i++;
        }
        while (block.length && block[block.length - 1] === '') block.pop();
        data[key] = block.join('\n');
      } else {
        data[key] = rest.replace(/^["']|["']$/g, ''); i++;
      }
    }
    return { data: data, body: m[2] };
  }

  // Split the trailing "**Sources:** [a](u) · [b](v)" block off the body
  function splitSources(md) {
    var re = /\n-{3,}\s*\n+\s*\*\*(Sources|Quellen):\*\*([\s\S]*)$/;
    var m = md.match(re);
    if (!m) return { body: md, sources: [] };
    var list = [], lr = /\[([^\]]+)\]\(([^)\s]+(?:\([^)]*\)[^)\s]*)*)\)/g, x;
    while ((x = lr.exec(m[2]))) list.push({ label: x[1], url: x[2] });
    return { body: md.slice(0, m.index), sources: list };
  }

  function domain(u) { try { return new URL(u).hostname.replace(/^www\./, ''); } catch (e) { return ''; } }
  function encodeUrls(md) {
    return md.replace(/(!?\[[^\]]*\]\()([^)]+)(\))/g, function (_, a, u, b) { return a + u.trim().replace(/ /g, '%20') + b; });
  }
  function slugify(s) { return 'sec-' + s.toLowerCase().replace(/[^a-z0-9äöüß]+/g, '-').replace(/^-|-$/g, '').slice(0, 50); }

  var slug = (location.pathname.match(/^\/article\/([^/?#]+)/) || [])[1] || new URLSearchParams(location.search).get('slug');
  var status = document.getElementById('art-status');
  if (!slug) { status.textContent = isDE ? 'Artikel nicht gefunden.' : 'Article not found.'; return; }
  slug = decodeURIComponent(slug);

  Promise.all([
    fetch('/content/articles/' + encodeURIComponent(slug) + '.md').then(function (r) { if (!r.ok) throw 0; return r.text(); }),
    E.articles().catch(function () { return []; })
  ]).then(function (res) {
    var fm = parseFrontMatter(res[0]), d = fm.data, all = res[1];
    var cat = (d.category || '').toLowerCase();
    var title = (isDE && d.title_de) ? d.title_de : (d.title || slug);
    var stand = (isDE && d.subtitle_de) ? d.subtitle_de : (d.subtitle || '');
    var rawBody = (isDE && d.body_de) ? d.body_de : (d.body || fm.body);
    var split = splitSources(rawBody);
    var sources = split.sources;

    document.title = title + ' | Ecodemia';
    document.querySelector('meta[name="description"]').setAttribute('content', (isDE && d.excerpt_de) ? d.excerpt_de : (d.excerpt || stand));
    document.body.dataset.cat = cat;
    document.getElementById('art').dataset.cat = cat;
    document.getElementById('related').dataset.cat = cat;
    document.querySelectorAll('.nav a[data-cat="' + cat + '"]').forEach(function (a) { a.setAttribute('aria-current', 'page'); });

    var kicker = document.getElementById('art-kicker');
    kicker.dataset.cat = cat;
    kicker.textContent = E.t(cat);
    document.getElementById('art-title').textContent = title;
    if (stand) { var s = document.getElementById('art-stand'); s.textContent = stand; s.hidden = false; }

    // Meta line
    var words = split.body.split(/\s+/).filter(Boolean).length;
    var mins = Math.max(1, Math.round(words / 200));
    var meta = [];
    meta.push('<span>' + esc(E.t('published')) + ' ' + esc(E.fmtDate(d.date)) + '</span>');
    if (d.updated) meta.push('<span>' + esc(E.t('updated')) + ' ' + esc(E.fmtDate(d.updated)) + '</span>');
    if (d.checked) meta.push('<span>' + esc(E.t('checked')) + ' ' + esc(E.fmtDate(d.checked)) + '</span>');
    meta.push('<span>' + mins + ' ' + esc(E.t('minRead')) + '</span>');
    if (sources.length) meta.push('<a class="src" href="#sources">' + esc(E.sourceCount(sources.length)) + '</a>');
    meta.push('<span>Ecodemia</span>');
    document.getElementById('art-meta').innerHTML = meta.join('');

    // Update / correction note
    var note = (isDE && d.update_note_de) ? d.update_note_de : (d.update_note || '');
    if (note) {
      var un = document.getElementById('art-update');
      un.innerHTML = '<b>' + esc(E.t('updated')) + (d.updated ? ' ' + esc(E.fmtDate(d.updated)) : '') + '</b>' + esc(note);
      un.hidden = false;
    }

    // Cover
    if (d.cover_image) {
      var img = document.getElementById('art-img');
      img.src = d.cover_image;
      img.alt = (isDE && d.cover_alt_de) ? d.cover_alt_de : (d.cover_alt || '');
      var credit = (isDE && d.cover_credit_de) ? d.cover_credit_de : (d.cover_credit || '');
      if (credit) document.getElementById('art-credit').innerHTML = marked.parseInline(credit);
      document.getElementById('art-cover').hidden = false;
    }

    // Key facts
    var facts = (isDE && d.key_facts_de) ? d.key_facts_de : (d.key_facts || '');
    var factItems = facts.split('\n').map(function (l) { return l.replace(/^\s*[-*]\s+/, '').trim(); }).filter(Boolean);
    if (factItems.length) {
      var fx = document.getElementById('art-facts');
      fx.dataset.cat = cat;
      fx.innerHTML = '<span class="kicker">' + (isDE ? 'Das Wichtigste' : 'Key facts') + '</span><ul>' +
        factItems.map(function (f) { return '<li>' + marked.parseInline(f) + '</li>'; }).join('') + '</ul>';
      fx.hidden = false;
    }

    // Body: citation markers [^n] become chips linking to the numbered source list
    var body = encodeUrls(split.body).replace(/\[\^(\d+)\]/g, function (_, n) {
      var src = sources[+n - 1];
      var tt = src ? ' title="' + esc(src.label) + '"' : '';
      return '<a class="cite" href="#src-' + n + '"' + tt + '>' + n + '</a>';
    });
    var bodyEl = document.getElementById('art-body');
    bodyEl.innerHTML = marked.parse(body);
    bodyEl.querySelectorAll('a[href^="http"]').forEach(function (a) { a.target = '_blank'; a.rel = 'noopener'; });

    // Contents rail from h2 headings
    var hs = bodyEl.querySelectorAll('h2');
    var toc = document.getElementById('art-toc');
    if (hs.length >= 3) {
      var links = [];
      hs.forEach(function (h) { h.id = slugify(h.textContent); links.push('<a href="#' + h.id + '">' + esc(h.textContent) + '</a>'); });
      if (sources.length) links.push('<a href="#sources">' + (isDE ? 'Quellen' : 'Sources') + ' (' + sources.length + ')</a>');
      toc.innerHTML = '<span class="label">' + (isDE ? 'Inhalt' : 'Contents') + '</span>' + links.join('');
      toc.hidden = false;
      var tocLinks = toc.querySelectorAll('a');
      if ('IntersectionObserver' in window) {
        var obs = new IntersectionObserver(function (entries) {
          entries.forEach(function (en) {
            if (en.isIntersecting) {
              tocLinks.forEach(function (l) { l.classList.toggle('on', l.getAttribute('href') === '#' + en.target.id); });
            }
          });
        }, { rootMargin: '-90px 0px -70% 0px' });
        hs.forEach(function (h) { obs.observe(h); });
      }
    } else {
      document.getElementById('art-grid').classList.add('no-toc');
    }

    // Numbered sources
    if (sources.length) {
      var sec = document.getElementById('sources');
      sec.innerHTML = '<h2>' + (isDE ? 'Quellen' : 'Sources') + '</h2><ol>' +
        sources.map(function (s, i) {
          return '<li id="src-' + (i + 1) + '"><span><a href="' + esc(s.url) + '" target="_blank" rel="noopener">' + esc(s.label) + '</a>' +
            '<span class="dom">' + esc(domain(s.url)) + '</span></span></li>';
        }).join('') + '</ol>' +
        '<p class="sources-note">' + (isDE
          ? 'Fehler gefunden? Wir korrigieren ihn und vermerken die Änderung. <a href="/about#corrections">Korrekturrichtlinie</a>'
          : 'Found an error? We correct it and note the change. <a href="/about#corrections">Corrections policy</a>') + '</p>';
      sec.hidden = false;
    }

    // Related: same section first, then newest others
    var others = all.filter(function (a) { return a.slug !== slug; });
    var rel = others.filter(function (a) { return a.category === cat; }).concat(others.filter(function (a) { return a.category !== cat; })).slice(0, 3);
    if (rel.length) {
      var r = document.getElementById('related');
      r.innerHTML = '<h2>' + (isDE ? 'Weiterlesen' : 'Read next') + '</h2><div class="cards">' + rel.map(function (a) {
        return '<a class="card" href="' + E.articleUrl(a) + '">' +
          '<div class="photo">' + (a.cover_image ? '<img src="' + esc(a.cover_image) + '" alt="" loading="lazy">' : '') + '</div>' +
          E.kickerHTML(a) + '<h3 class="hl">' + esc(E.loc(a, 'title')) + '</h3>' + E.metaHTML(a) + '</a>';
      }).join('') + '</div>';
      r.hidden = false;
    }

    status.remove();
    document.getElementById('art').hidden = false;
    if (location.hash) { var tg = document.getElementById(location.hash.slice(1)); if (tg) tg.scrollIntoView(); }
  }).catch(function () {
    status.innerHTML = (isDE
      ? 'Dieser Artikel wurde nicht gefunden. <a href="/" style="color:var(--forest);text-decoration:underline">Zur Startseite</a>'
      : 'This article could not be found. <a href="/" style="color:var(--forest);text-decoration:underline">Back to the homepage</a>');
  });
}());
</script>
</body>
</html>
