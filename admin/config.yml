backend:
  name: github
  repo: maierm0201/ecodemia
  branch: main
  base_url: https://www.ecodemia.org
  auth_endpoint: api/auth

media_folder: "assets/images"
public_folder: "/assets/images"

collections:
  - name: "articles"
    label: "Articles"
    label_singular: "Article"
    folder: "content/articles"
    create: true
    delete: true
    slug: "{{slug}}"
    preview_path: "/article/{{slug}}"
    summary: "{{title}} ({{date}})"
    fields:
      - label: "Title"
        name: "title"
        widget: "string"
        required: true

      - label: "Subtitle"
        name: "subtitle"
        widget: "string"
        required: false
        hint: "Optional standfirst shown below the title on the article page"

      - label: "Date"
        name: "date"
        widget: "datetime"
        format: "YYYY-MM-DD"
        date_format: "DD.MM.YYYY"
        time_format: false
        required: false
        default: ""

      - label: "Category"
        name: "category"
        widget: "select"
        required: false
        options:
          - { label: "Climate",  value: "climate"  }
          - { label: "Wildlife", value: "wildlife" }
          - { label: "Energy",   value: "energy"   }
          - { label: "Living",   value: "living"   }
          - { label: "Tech",     value: "tech"     }
          - { label: "Policy",   value: "policy"   }

      - label: "Cover Image"
        name: "cover_image"
        widget: "image"
        required: false
        hint: "Recommended size: 1200 × 630 px"

      - label: "Cover Image Credit"
        name: "cover_credit"
        widget: "string"
        required: false
        hint: "Photographer, source and licence, e.g. Photo: Jane Doe / Wikimedia Commons, [CC BY 4.0](https://creativecommons.org/licenses/by/4.0/). Required for CC-licensed images."

      - label: "Cover Image Alt Text"
        name: "cover_alt"
        widget: "string"
        required: false
        hint: "Short description of the image for screen readers"

      - label: "Excerpt"
        name: "excerpt"
        widget: "text"
        required: false
        hint: "Short summary shown in article lists and category pages"

      - label: "Search title (SEO)"
        name: "seo_title"
        widget: "string"
        required: false
        pattern: ['^.{30,60}$', "Search title: 30 to 60 characters"]
        hint: "Title shown in Google results. 30–60 characters, the term people search for first (e.g. 'Heat Pump or Gas? The New Heating Rules for Homeowners'). ' | Ecodemia' is optional. Must not promise more than the headline. Check: node scripts/seo.js"

      - label: "Search description (SEO)"
        name: "seo_description"
        widget: "text"
        required: false
        pattern: ['^[\s\S]{120,155}$', "Search description: 120 to 155 characters"]
        hint: "Text below the title in Google results and on social cards. 120–155 characters. Only what the article says, with the same numbers, qualifiers ('about', 'an estimated', 'up to') and attribution. No added facts or superlatives."

      - label: "Key facts"
        name: "key_facts"
        widget: "text"
        required: false
        hint: "Optional. 2–4 short facts shown in a box at the top of the article. One per line, each starting with '- '."

      - label: "Last checked"
        name: "checked"
        widget: "datetime"
        format: "YYYY-MM-DD"
        date_format: "DD.MM.YYYY"
        time_format: false
        required: false
        hint: "Date on which all facts and links were last verified"

      - label: "Updated"
        name: "updated"
        widget: "datetime"
        format: "YYYY-MM-DD"
        date_format: "DD.MM.YYYY"
        time_format: false
        required: false
        hint: "Only if the article was changed after publication"

      - label: "Update / correction note"
        name: "update_note"
        widget: "text"
        required: false
        hint: "Shown at the top of the article. Say what changed, e.g. 'Updated with the final COP31 decision.'"

      - label: "Body (English)"
        name: "body"
        widget: "markdown"
        required: false
        hint: "End with a line '---' and then '**Sources:** [Name](https://…) · [Name](https://…)'. Mark claims in the text with [^1], [^2] … matching the order of the sources."

      - label: "Title (Deutsch)"
        name: "title_de"
        widget: "string"
        required: false
        hint: "German title — leave blank to show the English title"

      - label: "Subtitle (Deutsch)"
        name: "subtitle_de"
        widget: "string"
        required: false
        hint: "German subtitle — leave blank to show the English subtitle"

      - label: "Excerpt (Deutsch)"
        name: "excerpt_de"
        widget: "text"
        required: false
        hint: "German excerpt — leave blank to show the English excerpt"

      - label: "Search title (Deutsch, SEO)"
        name: "seo_title_de"
        widget: "string"
        required: false
        pattern: ['^.{30,60}$', "Suchtitel: 30 bis 60 Zeichen"]
        hint: "Titel in den Google-Ergebnissen. 30–60 Zeichen, deutscher Suchbegriff zuerst (Wärmepumpe, Strompreis, Balkonkraftwerk …), nicht wörtlich übersetzt."

      - label: "Search description (Deutsch, SEO)"
        name: "seo_description_de"
        widget: "text"
        required: false
        pattern: ['^[\s\S]{120,155}$', "Suchbeschreibung: 120 bis 155 Zeichen"]
        hint: "Text unter dem Titel in den Google-Ergebnissen. 120–155 Zeichen. Nur was im Artikel steht, mit denselben Zahlen, Einschränkungen und Quellenangaben."

      - label: "Key facts (Deutsch)"
        name: "key_facts_de"
        widget: "text"
        required: false
        hint: "German key facts, one per line starting with '- '"

      - label: "Update note (Deutsch)"
        name: "update_note_de"
        widget: "text"
        required: false

      - label: "Body (Deutsch)"
        name: "body_de"
        widget: "markdown"
        required: false
        hint: "German body — leave blank to show the English body"
