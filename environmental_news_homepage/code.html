<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ecodemia | Climate, nature and energy news in English and German</title>
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="/assets/brand/favicon/favicon-32x32.png" sizes="32x32" type="image/png">
<link rel="icon" href="/assets/brand/favicon/favicon-16x16.png" sizes="16x16" type="image/png">
<link rel="apple-touch-icon" href="/assets/brand/favicon/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<link rel="alternate" type="application/rss+xml" title="Ecodemia (English)" href="/feed.xml">
<link rel="alternate" type="application/rss+xml" title="Ecodemia (Deutsch)" href="/feed-de.xml">
<meta name="theme-color" content="#0b3d2b">
<meta name="description" content="Ecodemia: independent, bilingual reporting on climate, wildlife, energy and environmental policy. Every article lists its sources.">
<link rel="preload" href="/assets/fonts/schibsted-grotesk-normal-400-800-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/assets/fonts/newsreader-normal-400-600-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/css/ecodemia.css">
</head>
<body data-page="home">
<div id="site-header"></div>

<main class="wrap">
  <h1 class="visually-hidden">Ecodemia</h1>

  <section class="home-top" aria-label="Top stories">
    <div id="lead" class="lead"><p class="status">Loading…</p></div>
    <aside class="latest" aria-labelledby="latest-h">
      <h2 id="latest-h" class="label">Latest</h2>
      <div id="latest-list"></div>
    </aside>
  </section>

  <section id="figures" class="figures" aria-label="By the numbers"></section>

  <div id="sections"></div>

  <section class="wire" aria-labelledby="wire-h">
    <div class="wire-head">
      <h2 id="wire-h"><i></i><span id="wire-title">Live from other newsrooms</span></h2>
      <p id="wire-note">Guardian · BBC · Mongabay · Grist · CleanTechnica</p>
    </div>
    <ul id="wire-list"></ul>
    <a class="more" href="/live" id="wire-more">All live updates →</a>
  </section>
</main>

<div id="site-footer"></div>

<script src="/js/ecodemia.js"></script>
<script>
(function () {
  'use strict';
  var E = window.Eco, isDE = E.isDE, esc = E.esc;

  if (isDE) {
    document.getElementById('latest-h').textContent = 'Neueste Artikel';
    document.getElementById('wire-title').textContent = 'Aktuell aus anderen Redaktionen';
    document.getElementById('wire-more').textContent = 'Alle Meldungen →';
  }

  // Figures: one per core section, each with its source
  document.getElementById('figures').innerHTML = ['climate', 'wildlife', 'energy'].map(function (c) {
    return E.figureHTML(E.sectionInfo(c), c);
  }).join('');

  function photo(a, eager) {
    return '<div class="photo">' + (a.cover_image ? '<img src="' + esc(a.cover_image) + '" alt="' + esc((E.loc(a, 'cover_alt')) || '') + '"' + (eager ? '' : ' loading="lazy"') + '>' : '') + '</div>';
  }

  E.articles().then(function (all) {
    if (!all.length) { document.getElementById('lead').innerHTML = ''; return; }
    var a = all[0];
    document.getElementById('lead').innerHTML =
      '<a href="' + E.articleUrl(a) + '" style="display:grid;gap:14px">' + photo(a, true) +
        E.kickerHTML(a) + '<h2 class="hl">' + esc(E.loc(a, 'title')) + '</h2>' +
        '<p class="stand">' + esc(E.loc(a, 'subtitle') || E.loc(a, 'excerpt')) + '</p></a>' + E.metaHTML(a);

    document.getElementById('latest-list').innerHTML = all.slice(1, 6).map(function (x) {
      return '<a class="latest-item" href="' + E.articleUrl(x) + '">' + E.kickerHTML(x) +
        '<h3 class="hl">' + esc(E.loc(x, 'title')) + '</h3>' + E.metaHTML(x, { time: false }) + '</a>';
    }).join('');

    // One row per section that has articles (newest section first)
    var shown = {}; shown[a.slug] = true;
    var order = [];
    all.forEach(function (x) { if (order.indexOf(x.category) === -1 && E.SECTIONS.indexOf(x.category) !== -1) order.push(x.category); });
    document.getElementById('sections').innerHTML = order.map(function (cat) {
      var items = all.filter(function (x) { return x.category === cat && !shown[x.slug]; }).slice(0, 3);
      if (!items.length) return '';
      return '<section class="sec-row" data-cat="' + cat + '">' +
        '<div class="sec-row-head"><h2><i></i>' + esc(E.t(cat)) + '</h2><a href="/' + cat + '">' + (isDE ? 'Alle Artikel' : 'All articles') + ' →</a></div>' +
        '<div class="cards">' + items.map(function (x) {
          return '<a class="card" href="' + E.articleUrl(x) + '">' + photo(x) +
            '<h3 class="hl">' + esc(E.loc(x, 'title')) + '</h3>' +
            '<p class="stand">' + esc(E.loc(x, 'excerpt')) + '</p>' + E.metaHTML(x) + '</a>';
        }).join('') + '</div></section>';
    }).join('');
  }).catch(function () {
    document.getElementById('lead').innerHTML = '<p class="status">' + (isDE ? 'Artikel konnten nicht geladen werden.' : 'Articles could not be loaded.') + '</p>';
  });

  // Live wire: newest headlines from partner newsrooms
  function relTime(iso) {
    var diff = (Date.now() - new Date(iso).getTime()) / 1000;
    if (diff < 3600) return Math.max(1, Math.round(diff / 60)) + (isDE ? ' Min.' : ' min ago');
    if (diff < 86400) return Math.round(diff / 3600) + (isDE ? ' Std.' : ' h ago');
    return E.fmtDate(iso, { day: 'numeric', month: 'short' });
  }
  fetch('/api/live-updates').then(function (r) { if (!r.ok) throw 0; return r.json(); }).then(function (data) {
    var items = (data.items || []).filter(function (i) { return i.title && i.link; }).slice(0, 5);
    if (!items.length) throw 0;
    document.getElementById('wire-list').innerHTML = items.map(function (i) {
      return '<li><a href="' + esc(i.link) + '" target="_blank" rel="noopener"><span>' + esc(i.source) + ' · ' + esc(relTime(i.date)) + '</span><span>' + esc(i.title) + ' ↗</span></a></li>';
    }).join('');
  }).catch(function () {
    document.getElementById('wire-list').innerHTML = '<li style="font-family:var(--f-body);color:#b9c6bf;padding:10px 0">' + (isDE ? 'Gerade nicht verfügbar.' : 'Not available right now.') + '</li>';
  });
}());
</script>
</body>
</html>
