<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ecodemia</title>
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="/assets/brand/favicon/favicon-32x32.png" sizes="32x32" type="image/png">
<link rel="icon" href="/assets/brand/favicon/favicon-16x16.png" sizes="16x16" type="image/png">
<link rel="apple-touch-icon" href="/assets/brand/favicon/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#0b3d2b">
<meta name="description" content="Independent, bilingual environmental reporting. Every article lists its sources.">
<link rel="preload" href="/assets/fonts/schibsted-grotesk-normal-400-800-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/css/ecodemia.css">
<script>
  // Section comes from the clean URL (/climate) or ?category=
  (function () {
    var seg = location.pathname.split('/').filter(Boolean)[0] || '';
    var c = (new URLSearchParams(location.search).get('category') || seg).toLowerCase();
    document.documentElement.dataset.section = c;
  })();
</script>
</head>
<body data-page="section">
<div id="site-header"></div>

<main class="wrap" id="sec-main">
  <header class="sec-head">
    <div>
      <h1><i></i><span id="sec-title">&nbsp;</span></h1>
      <p id="sec-desc" class="stand"></p>
      <p id="sec-count" class="meta count"></p>
    </div>
    <div id="sec-fig"></div>
  </header>

  <div class="sec-body">
    <div>
      <div id="sec-lead"></div>
      <div id="sec-list"></div>
      <div id="sec-empty" class="empty" hidden>
        <h2 id="empty-h">No articles in this section yet.</h2>
        <p id="empty-p">We only publish researched, sourced reporting. New articles for this section are in preparation.</p>
        <a href="/" id="empty-a">Browse all articles →</a>
      </div>
    </div>
    <aside class="side-box" id="side" hidden>
      <span class="label" id="side-h">More from Ecodemia</span>
      <div id="side-list"></div>
    </aside>
  </div>
</main>

<div id="site-footer"></div>

<script src="/js/ecodemia.js"></script>
<script>
(function () {
  'use strict';
  var E = window.Eco, isDE = E.isDE, esc = E.esc;
  var cat = document.documentElement.dataset.section;
  if (E.SECTIONS.indexOf(cat) === -1) cat = 'climate';
  document.body.dataset.cat = cat;
  document.getElementById('sec-main').dataset.cat = cat;

  var info = E.sectionInfo(cat);
  document.title = E.t(cat) + ' | Ecodemia';
  document.querySelector('meta[name="description"]').setAttribute('content', info.desc);
  document.getElementById('sec-title').textContent = E.t(cat);
  document.getElementById('sec-desc').textContent = info.desc;
  document.getElementById('sec-fig').innerHTML = E.figureHTML(info, cat);

  if (isDE) {
    document.getElementById('empty-h').textContent = 'In dieser Rubrik gibt es noch keine Artikel.';
    document.getElementById('empty-p').textContent = 'Wir veröffentlichen nur recherchierte Artikel mit Quellen. Neue Beiträge für diese Rubrik sind in Vorbereitung.';
    document.getElementById('empty-a').textContent = 'Alle Artikel ansehen →';
    document.getElementById('side-h').textContent = 'Mehr von Ecodemia';
  }

  function photo(a, eager) {
    return '<div class="photo">' + (a.cover_image ? '<img src="' + esc(a.cover_image) + '" alt=""' + (eager ? '' : ' loading="lazy"') + '>' : '') + '</div>';
  }

  E.articles().then(function (all) {
    var list = all.filter(function (a) { return a.category === cat; });
    var n = list.length;
    document.getElementById('sec-count').textContent = isDE
      ? (n === 1 ? '1 Artikel' : n + ' Artikel')
      : (n === 1 ? '1 article' : n + ' articles');

    if (!n) {
      document.getElementById('sec-empty').hidden = false;
    } else {
      var a = list[0];
      document.getElementById('sec-lead').innerHTML =
        '<a class="sec-lead" href="' + E.articleUrl(a) + '">' + photo(a, true) +
          '<div class="txt"><h2 class="hl">' + esc(E.loc(a, 'title')) + '</h2>' +
          '<p class="stand">' + esc(E.loc(a, 'excerpt')) + '</p>' + E.metaHTML(a) + '</div></a>';
      document.getElementById('sec-list').innerHTML = list.slice(1).map(function (x) {
        return '<a class="list-item" href="' + E.articleUrl(x) + '"><div class="txt">' +
          '<h2 class="hl">' + esc(E.loc(x, 'title')) + '</h2>' +
          '<p class="stand">' + esc(E.loc(x, 'excerpt')) + '</p>' + E.metaHTML(x) + '</div>' + photo(x) + '</a>';
      }).join('');
    }

    var others = all.filter(function (a) { return a.category !== cat; }).slice(0, 5);
    if (others.length) {
      document.getElementById('side-list').innerHTML = others.map(function (x) {
        return '<a class="side-item" href="' + E.articleUrl(x) + '">' + E.kickerHTML(x) + '<h3 class="hl">' + esc(E.loc(x, 'title')) + '</h3></a>';
      }).join('');
      document.getElementById('side').hidden = false;
    }
  }).catch(function () {
    document.getElementById('sec-empty').hidden = false;
  });
}());
</script>
</body>
</html>
